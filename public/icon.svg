<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="istmoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="#064e3b"/>
  <!-- Decorative ocean waves and mountain curves -->
  <path d="M64 340 C140 280, 220 380, 300 320 C380 260, 440 310, 448 300 L448 448 L64 448 Z" fill="#065f46" opacity="0.6"/>
  <!-- Isthmus Bridge Arc connecting Panama and Colombia -->
  <path d="M120 280 C200 160, 312 160, 392 280" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
  <!-- Two interconnected destination nodes: Panama (Canal/Maritime) & Colombia (Andes/Biodiversity) -->
  <circle cx="140" cy="270" r="36" fill="#0284c7" stroke="#ffffff" stroke-width="8"/>
  <circle cx="372" cy="270" r="36" fill="#16a34a" stroke="#ffffff" stroke-width="8"/>
  <!-- Compass Star in center -->
  <polygon points="256,120 270,180 330,194 270,208 256,268 242,208 182,194 242,180" fill="url(#goldGrad)"/>
  <!-- Monogram text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">TERRAISTMO</text>
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#93c5fd" text-anchor="middle" letter-spacing="6">PANAMÁ &amp; COLOMBIA</text>
</svg>
